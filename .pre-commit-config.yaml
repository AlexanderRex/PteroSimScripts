# Single source of truth for lint/format rules — CI runs the same via
# `pre-commit run --all-files` (see .github/workflows/lint.yml).
# Contributors: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # --strict flags untyped defs; missing 3rd-party stubs treated as Any
        args: [--strict, --ignore-missing-imports, --scripts-are-modules]
